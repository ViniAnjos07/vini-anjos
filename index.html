<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Você ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow: hidden;
}

.container {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

img {
    max-width: 90%;
    max-height: 70vh;
    border-radius: 15px;
    box-shadow: 0 0 40px rgba(255,255,255,0.3);
    margin-bottom: 20px;
    transition: opacity 0.8s ease;
}

.frase {
    font-size: 22px;
    margin: 20px;
    min-height: 60px;
    transition: opacity 0.8s ease;
}

button {
    padding: 12px 30px;
    font-size: 16px;
    background: crimson;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: darkred;
    transform: scale(1.05);
}

.creditos {
    font-size: 26px;
    margin-top: 20px;
    animation: fadeIn 2s ease forwards;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<!-- Música de fundo -->
<audio id="musica" src="musica.mp3" autoplay loop></audio>

<div class="container">
    <img id="imagem" src="foto1.jpeg">
    <div class="frase" id="frase"></div>
    <button onclick="proximo()" id="botao">Prosseguir</button>
</div>

<script>
const imagens = [
    "foto1.jpeg",
    "foto2.jpeg",
    "foto3.jpeg",
    "foto4.jpeg"
];

const frases = [
    "Desde que você apareceu, meus dias ganharam cor.",
    "Seu sorriso é o meu lugar favorito no mundo.",
    "Cada momento ao seu lado é um presente.",
    "Você é o sentimento mais bonito que já vivi."
];

let indice = 0;

const img = document.getElementById("imagem");
const frase = document.getElementById("frase");
const botao = document.getElementById("botao");

// Pré-carregar imagens
imagens.forEach(src => {
    const i = new Image();
    i.src = src;
});

frase.innerText = frases[0];

function proximo() {
    indice++;

    if (indice < imagens.length) {
        img.style.opacity = 0;
        frase.style.opacity = 0;

        setTimeout(() => {
            img.src = imagens[indice];
            frase.innerText = frases[indice];
            img.style.opacity = 1;
            frase.style.opacity = 1;
        }, 800);

    } else {
        img.style.display = "none";
        frase.innerHTML = '<div class="creditos">Do seu amor,<br>Vini ❤️</div>';
        botao.style.display = "none";
    }
}
</script>

</body>
</html>
