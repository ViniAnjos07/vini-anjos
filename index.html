<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma História Especial ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    background:black;
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
}

/* SUSPENSE */
.suspense{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:20;
    font-size:28px;
    text-align:center;
}

.fade{opacity:0; transition:2s;}
.show{opacity:1;}

/* INTRO */
.intro{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
}

.intro h1{font-size:40px; text-align:center; padding:20px;}
.intro button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    background:red;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* GALERIA */
.galeria{
    position:absolute;
    width:100%;
    height:100%;
}

.galeria img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:2s;
    transform:scale(1);
}

.galeria img.active{
    opacity:1;
    animation: zoom 6s linear;
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

/* FRASE */
.frase{
    position:absolute;
    bottom:60px;
    width:100%;
    text-align:center;
    font-size:24px;
    background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    padding:30px;
}

/* CREDITOS */
.creditos{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    opacity:0;
    transition:4s;
    text-align:center;
}
</style>
</head>

<body>

<div class="suspense" id="suspense">
    <div id="textoSuspense" class="fade"></div>
</div>

<div class="intro" id="intro">
    <h1>Nem toda história começa com planos...</h1>
    <button onclick="iniciar()">Começar</button>
</div>

<div class="galeria">
    <img src="foto.jpeg">
    <img src="foto1.jpeg">
    <img src="foto2.jpeg">
    <img src="foto3.jpeg">
    <img src="foto4.jpeg">
</div>

<div class="frase" id="frase"></div>

<div class="creditos" id="creditos">
    Do seu amor, Vini ❤️
</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* SUSPENSE */
const suspenseTextos = [
"Espera...",
"Antes de começar...",
"Eu preciso que você sinta isso...",
"Porque isso não é só um site.",
"É algo que nasceu aqui dentro..."
];

let sIndex = 0;
const textoSuspense = document.getElementById("textoSuspense");

function mostrarSuspense(){
    if(sIndex < suspenseTextos.length){
        textoSuspense.classList.remove("show");
        setTimeout(()=>{
            textoSuspense.innerText = suspenseTextos[sIndex];
            textoSuspense.classList.add("show");
            sIndex++;
        },1000);
    } else {
        clearInterval(loopSuspense);
        setTimeout(()=>{
            document.getElementById("suspense").style.display="none";
            document.getElementById("intro").style.display="flex";
        },2000);
    }
}

let loopSuspense = setInterval(mostrarSuspense,4000);

/* SHOW */
const frases = [
"Mas às vezes começa com um olhar diferente...",
"E sem perceber, você já se tornou especial.",
"Seu sorriso mudou o meu dia mais de uma vez.",
"Tem algo em você que me faz querer ficar.",
"E talvez… seja só o começo de algo lindo."
];

let index = 0;
const fotos = document.querySelectorAll(".galeria img");
const frase = document.getElementById("frase");
let intervalo;

function iniciar(){
    document.getElementById("intro").style.display="none";
    document.getElementById("musica").play();

    fotos[0].classList.add("active");
    frase.innerText = frases[0];

    intervalo = setInterval(trocarFoto,6000);
}

function trocarFoto(){
    fotos[index].classList.remove("active");
    index++;

    if(index < fotos.length){
        fotos[index].classList.add("active");
        frase.innerText = frases[index];
    } else {
        clearInterval(intervalo);
        setTimeout(()=>{
            document.getElementById("creditos").style.opacity="1";
        },4000);
    }
}

</script>

</body>
</html>
